
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Cart | Sacchi Flyier</title>
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #252525;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .back-link {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #fff;
    }

    main {
      width: 86%;
      max-width: 1100px;
      margin: 55px auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 35px;
      font-size: 14px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .cart-items,
    .summary {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 24px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid #292929;
    }

    .cart-item:first-child {
      padding-top: 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item img {
      width: 105px;
      height: 115px;
      object-fit: cover;
      border-radius: 8px;
      background: #1c1c1c;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .item-price {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 13px;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quantity-btn {
      width: 30px;
      height: 30px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
      cursor: pointer;
      font-size: 17px;
    }

    .quantity {
      min-width: 18px;
      text-align: center;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #aaa;
      text-decoration: underline;
      cursor: pointer;
      font-size: 12px;
      margin-left: 8px;
    }

    .remove-btn:hover {
      color: #fff;
    }

    .summary h2 {
      font-size: 20px;
      margin-bottom: 22px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 17px;
    }

    .summary-row.total {
      border-top: 1px solid #333;
      padding-top: 18px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    .shipping-note {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin: 15px 0 22px;
    }

    .checkout-btn {
      width: 100%;
      padding: 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 7px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.25s;
    }

    .checkout-btn:hover {
      background: #ccc;
      transform: translateY(-2px);
    }

    .empty-cart {
      text-align: center;
      padding: 55px 15px;
    }

    .empty-cart h2 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .empty-cart p {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      padding: 13px 25px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 750px) {
      header {
        padding: 18px 5%;
      }

      .logo {
        font-size: 17px;
      }

      main {
        width: 90%;
        margin: 35px auto;
      }

      h1 {
        font-size: 28px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-items,
      .summary {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">SACCHI FLYIER</a>
    <a href="index.html" class="back-link">← Back to Shop</a>
  </header>

  <main>
    <h1>YOUR CART</h1>
    <p class="subtitle">Review your selected products before checkout.</p>

    <div id="cartContent"></div>
  </main>

  <script src="cart.js"></script>

  <script>
    const cartContent = document.getElementById("cartContent");

    function formatUSD(amount) {
      return "$" + Number(amount).toFixed(2);
    }

    function renderCart() {
      const items = SacchiCart.getCart();

      if (!items.length) {
        cartContent.innerHTML = `
          <div class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>You haven't added any products yet.</p>
            <a href="index.html" class="shop-btn">CONTINUE SHOPPING</a>
          </div>
        `;
        return;
      }

      const subtotal = SacchiCart.getTotalUSD(items);

      cartContent.innerHTML = `
        <div class="cart-layout">

          <section class="cart-items">
            ${items.map((item, index) => `
              <article class="cart-item">

                <img
                  src="${escapeHTML(item.image)}"
                  alt="${escapeHTML(item.name)}"
                  onerror="this.style.display='none'"
                >

                <div>
                  <div class="item-name">
                    ${escapeHTML(item.name)}
                  </div>

                  <div class="item-price">
                    ${formatUSD(item.unitPriceUSD)} each
                  </div>

                  <div class="item-controls">
                    <button
                      class="quantity-btn"
                      onclick="changeQuantity(${index}, -1)"
                      aria-label="Decrease quantity"
                    >−</button>

                    <span class="quantity">${item.quantity}</span>

                    <button
                      class="quantity-btn"
                      onclick="changeQuantity(${index}, 1)"
                      aria-label="Increase quantity"
                    >+</button>

                    <button
                      class="remove-btn"
                      onclick="removeItem(${index})"
                    >Remove</button>
                  </div>
                </div>

              </article>
            `).join("")}
          </section>

          <aside class="summary">
            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">
              <span>Subtotal</span>
              <span>${formatUSD(subtotal)}</span>
            </div>

            <div class="summary-row">
              <span>Shipping</span>
              <span>Included*</span>
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <span>${formatUSD(subtotal)}</span>
            </div>

            <p class="shipping-note">
              *Shipping is shown as included in this cart preview.
              Confirm your final shipping and payment arrangements
              before accepting real customer orders.
            </p>

            <button class="checkout-btn" onclick="goToCheckout()">
              PROCEED TO CHECKOUT
            </button>
          </aside>

        </div>
      `;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function changeQuantity(index, change) {
      const items = SacchiCart.getCart();
      if (!items[index]) return;

      SacchiCart.updateQuantity(
        index,
        items[index].quantity + change
      );

      renderCart();
    }

    function removeItem(index) {
      SacchiCart.remove(index);
      renderCart();
    }

    function goToCheckout() {
      SacchiCart.clearBuyNow();
      window.location.href = "checkout.html";
    }

    window.addEventListener("sacchi:cart-updated", renderCart);

    renderCart();
  </script>

</body>
</html>
