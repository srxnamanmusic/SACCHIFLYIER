
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Sacchi Flyier</title>
<meta name="description" content="Your Sacchi Flyier shopping cart.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

header {
    width: 100%;
    min-height: 90px;
    padding: 20px 5.5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
}

.back {
    border: 1px solid #444;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
}

.back:hover {
    background: #fff;
    color: #000;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px 80px;
}

.heading {
    margin-bottom: 35px;
}

.heading p {
    color: #999;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.heading h1 {
    font-size: 38px;
}

.cart-layout {
    display: grid;
    grid-template-columns: 1.5fr 0.8fr;
    gap: 25px;
    align-items: start;
}

.panel {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 25px;
}

.panel h2 {
    font-size: 19px;
    margin-bottom: 20px;
}

.cart-item {
    display: grid;
    grid-template-columns: 105px 1fr auto;
    gap: 18px;
    padding: 20px 0;
    border-bottom: 1px solid #292929;
    align-items: center;
}

.cart-item:first-child {
    padding-top: 0;
}

.product-image {
    width: 105px;
    height: 105px;
    object-fit: cover;
    border-radius: 12px;
    background: #181818;
}

.product-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 7px;
}

.product-detail {
    color: #888;
    font-size: 12px;
    line-height: 1.7;
}

.product-price {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
}

.quantity-box {
    display: flex;
    align-items: center;
    width: fit-content;
    border: 1px solid #444;
    border-radius: 9px;
    overflow: hidden;
}

.quantity-box button {
    width: 34px;
    height: 34px;
    border: none;
    background: #181818;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
}

.quantity-box button:hover {
    background: #333;
}

.quantity-box span {
    width: 38px;
    text-align: center;
    font-size: 13px;
}

.remove-button {
    display: inline-block;
    margin-top: 10px;
    border: none;
    background: transparent;
    color: #999;
    text-decoration: underline;
    font-size: 12px;
    cursor: pointer;
}

.remove-button:hover {
    color: #fff;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 15px 0;
    color: #aaa;
    font-size: 14px;
}

.summary-total {
    border-top: 1px solid #444;
    margin-top: 10px;
    padding-top: 20px;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
}

.checkout-button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: 1px solid #fff;
    border-radius: 30px;
    background: #fff;
    color: #000;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.checkout-button:hover {
    background: #ddd;
}

.continue-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #aaa;
    font-size: 13px;
    text-decoration: underline;
}

.empty-state {
    text-align: center;
    padding: 55px 20px;
    color: #aaa;
    line-height: 1.8;
}

.empty-state h2 {
    color: #fff;
    margin-bottom: 10px;
}

.empty-state a {
    display: inline-block;
    margin-top: 18px;
    color: #fff;
    text-decoration: underline;
}

footer {
    border-top: 1px solid #222;
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 12px;
}

@media (max-width: 760px) {
    header {
        padding: 18px;
        min-height: 75px;
    }

    .logo {
        font-size: 17px;
    }

    .back {
        padding: 10px 14px;
        font-size: 12px;
    }

    main {
        padding: 30px 15px 50px;
    }

    .heading h1 {
        font-size: 30px;
    }

    .cart-layout {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 18px;
    }

    .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 12px;
    }

    .product-image {
        width: 80px;
        height: 80px;
    }

    .item-total {
        grid-column: 2;
    }
}

@media (max-width: 380px) {
    .logo {
        font-size: 15px;
    }

    .back {
        font-size: 11px;
        padding: 9px 10px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">SACCHI FLYIER</a>
    <a href="index.html" class="back">← Back to Shop</a>
</header>

<main>

    <div class="heading">
        <p>SACCHI FLYIER</p>
        <h1>Your Shopping Cart</h1>
    </div>

    <div id="emptyState" class="panel empty-state" hidden>
        <h2>Your cart is empty.</h2>
        <p>Discover something you love at Sacchi Flyier.</p>
        <a href="index.html">Continue Shopping</a>
    </div>

    <div class="cart-layout" id="cartContent">

        <section class="panel">
            <h2>Shopping Items</h2>
            <div id="cartItems"></div>
        </section>

        <aside class="panel">
            <h2>Order Summary</h2>

            <div class="summary-line">
                <span>Items</span>
                <span id="itemCount">0</span>
            </div>

            <div class="summary-line">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>

            <div class="summary-line">
                <span>Shipping</span>
                <span>Included</span>
            </div>

            <div class="summary-line summary-total">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>

            <button
                type="button"
                class="checkout-button"
                id="checkoutButton">
                PROCEED TO CHECKOUT
            </button>

            <a href="index.html" class="continue-link">
                Continue Shopping
            </a>
        </aside>

    </div>

</main>

<footer>
    © 2026 Sacchi Flyier. All rights reserved.
</footer>

<script src="cart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    "use strict";

    const cartItemsElement = document.getElementById("cartItems");
    const emptyState = document.getElementById("emptyState");
    const cartContent = document.getElementById("cartContent");

    const itemCountElement = document.getElementById("itemCount");
    const subtotalElement = document.getElementById("subtotal");
    const totalElement = document.getElementById("total");

    const checkoutButton = document.getElementById("checkoutButton");

    if (!window.SacchiCart) {
        cartContent.style.display = "none";
        emptyState.hidden = false;
        emptyState.innerHTML =
            "<h2>Cart system unavailable.</h2>" +
            "<p>Please check that cart.js is in the correct folder.</p>";
        return;
    }

    function money(value) {
        return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD"
        }).format(value);
    }

    function renderCart() {

        const cart = SacchiCart.getCart();

        cartItemsElement.innerHTML = "";

        if (!cart.length) {
            emptyState.hidden = false;
            cartContent.style.display = "none";
            return;
        }

        emptyState.hidden = true;
        cartContent.style.display = "grid";

        let subtotal = 0;
        let itemCount = 0;

        cart.forEach((item, index) => {

            const price = Number(
                item.unitPriceUSD ?? item.price ?? 0
            );

            const quantity = Math.max(
                1,
                Number(item.quantity) || 1
            );

            const lineTotal = price * quantity;

            subtotal += lineTotal;
            itemCount += quantity;

            const row = document.createElement("article");
            row.className = "cart-item";

            const image = document.createElement("img");
            image.className = "product-image";
            image.src = item.image || "logo.png";
            image.alt = item.name || "Product";
            image.onerror = () => {
                image.onerror = null;
                image.src = "logo.png";
            };

            const details = document.createElement("div");

            const name = document.createElement("p");
            name.className = "product-name";
            name.textContent = item.name || "Sacchi Flyier Product";

            const detail = document.createElement("p");
            detail.className = "product-detail";
            detail.textContent =
                (item.sku ? "SKU: " + item.sku + " | " : "") +
                (item.country || "Destination not selected");

            const quantityBox = document.createElement("div");
            quantityBox.className = "quantity-box";

            const minus = document.createElement("button");
            minus.type = "button";
            minus.textContent = "−";
            minus.setAttribute("aria-label", "Decrease quantity");

            const quantityText = document.createElement("span");
            quantityText.textContent = quantity;

            const plus = document.createElement("button");
            plus.type = "button";
            plus.textContent = "+";
            plus.setAttribute("aria-label", "Increase quantity");

            minus.addEventListener("click", () => {
                SacchiCart.updateQuantity(index, quantity - 1);
                renderCart();
            });

            plus.addEventListener("click", () => {
                SacchiCart.updateQuantity(index, quantity + 1);
                renderCart();
            });

            quantityBox.append(minus, quantityText, plus);

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "remove-button";
            remove.textContent = "Remove";

            remove.addEventListener("click", () => {
                SacchiCart.remove(index);
                renderCart();
            });

            details.append(name, detail, quantityBox, remove);

            const totalBox = document.createElement("div");
            totalBox.className = "item-total";

            const priceText = document.createElement("p");
            priceText.className = "product-price";
            priceText.textContent = money(lineTotal);

            totalBox.appendChild(priceText);

            row.append(image, details, totalBox);
            cartItemsElement.appendChild(row);

        });

        itemCountElement.textContent = itemCount;
        subtotalElement.textContent = money(subtotal);
        totalElement.textContent = money(subtotal);
    }

    checkoutButton.addEventListener("click", () => {

        const cart = SacchiCart.getCart();

        if (!cart.length) {
            renderCart();
            return;
        }

        // Clear an old Buy Now selection so normal cart checkout is used.
        localStorage.removeItem("sacchiFlyierBuyNow");

        window.location.href = "checkout.html";
    });

    window.addEventListener("sacchi:cart-updated", renderCart);

    renderCart();

});
</script>

</body>
</html>
