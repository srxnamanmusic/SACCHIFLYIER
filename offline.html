
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Sacchi Flyier | Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .offline-card {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
      background: #000000;
    }

    h1 {
      color: #d4af62;
      letter-spacing: 3px;
      font-size: 27px;
    }

    h2 {
      color: #ffffff;
      font-size: 23px;
    }

    p {
      color: #ffffff;
      line-height: 1.8;
    }

    .tagline {
      color: #d4af62;
      letter-spacing: 1px;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      border: 1px solid #d4af62;
      border-radius: 4px;
      background: #000000;
      color: #d4af62;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d4af62;
      color: #000000;
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <h1>SACCHI FLYIER</h1>
    <h2>You're Offline</h2>

    <p>
      Your internet connection is unavailable.
      Please reconnect to continue shopping.
    </p>

    <p class="tagline">MOVE DIFFERENT.</p>

    <button onclick="window.location.reload()">
      TRY AGAIN
    </button>
  </main>
</body>
</html>
