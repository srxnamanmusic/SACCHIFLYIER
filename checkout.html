<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Sacchi Flyier</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
    header{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
    header a{color:#fff;text-decoration:none}
    main{max-width:1100px;margin:35px auto;padding:0 20px}
    h1{margin-bottom:25px}
    .checkout-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:25px}
    .card{background:#131318;border:1px solid #292932;border-radius:16px;padding:22px}
    h2{font-size:20px;margin-top:0}
    label{display:block;margin:14px 0 7px;font-size:14px;color:#bbb}
    input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #363640;background:#0c0c10;color:#fff}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .checkout-item{padding:13px 0;border-bottom:1px solid #292932;display:flex;justify-content:space-between}
    .checkout-item small{display:block;color:#999;margin-top:5px}
    .summary-line{display:flex;justify-content:space-between;margin:13px 0;color:#ccc}
    .total{font-size:22px;font-weight:bold;padding-top:15px;border-top:1px solid #333}
    .free{color:#fff}
    button{width:100%;padding:15px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:bold;cursor:pointer;margin-top:20px}
    button:disabled{opacity:.45;cursor:not-allowed}
    .payment{margin-top:18px}
    .payment label{display:flex;gap:10px;align-items:center;background:#0d0d12;padding:12px;border-radius:8px}
    .payment input{width:auto}
    .empty-cart{color:#aaa}
    @media(max-width:750px){.checkout-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <a href="index.html"><strong>Sacchi Flyier</strong></a>
  <a href="index.html">← Back to Store</a>
</header>

<main>
  <h1>Checkout</h1>

  <form id="checkoutForm">
    <div class="checkout-grid">
      <section class="card">
        <h2>Customer Information</h2>

        <label for="checkoutName">Full Name</label>
        <input id="checkoutName" name="name" type="text" required>

        <label for="checkoutEmail">Email</label>
        <input id="checkoutEmail" name="email" type="email" required>

        <div class="row">
          <div>
  <label for="checkoutCountryCode">Country Code</label>
  <select id="checkoutCountryCode" name="countryCode" required>
    <option value="">Select</option>
    <option value="+93">Afghanistan (+93)</option>
    <option value="+355">Albania (+355)</option>
    <option value="+213">Algeria (+213)</option>
    <option value="+61">Australia (+61)</option>
    <option value="+32">Belgium (+32)</option>
    <option value="+55">Brazil (+55)</option>
    <option value="+1">Canada / USA (+1)</option>
    <option value="+86">China (+86)</option>
    <option value="+33">France (+33)</option>
    <option value="+49">Germany (+49)</option>
    <option value="+91">India (+91)</option>
    <option value="+62">Indonesia (+62)</option>
    <option value="+39">Italy (+39)</option>
    <option value="+81">Japan (+81)</option>
    <option value="+60">Malaysia (+60)</option>
    <option value="+52">Mexico (+52)</option>
    <option value="+977">Nepal (+977)</option>
    <option value="+64">New Zealand (+64)</option>
    <option value="+92">Pakistan (+92)</option>
    <option value="+63">Philippines (+63)</option>
    <option value="+7">Russia (+7)</option>
    <option value="+966">Saudi Arabia (+966)</option>
    <option value="+65">Singapore (+65)</option>
    <option value="+27">South Africa (+27)</option>
    <option value="+82">South Korea (+82)</option>
    <option value="+34">Spain (+34)</option>
    <option value="+94">Sri Lanka (+94)</option>
    <option value="+46">Sweden (+46)</option>
    <option value="+41">Switzerland (+41)</option>
    <option value="+66">Thailand (+66)</option>
    <option value="+90">Turkey (+90)</option>
    <option value="+971">United Arab Emirates (+971)</option>
    <option value="+44">United Kingdom (+44)</option>
    <option value="+84">Vietnam (+84)</option>
  </select>
</div>
          <div>
            <label for="checkoutPhone">Phone</label>
            <input id="checkoutPhone" name="phone" type="tel" required>
          </div>
        </div>

        <h2 style="margin-top:30px">Shipping Address</h2>

        <label for="checkoutAddress">Address</label>
        <input id="checkoutAddress" name="address" type="text" required>

        <div class="row">
          <div>
            <label for="checkoutCity">City</label>
            <input id="checkoutCity" name="city" type="text" required>
          </div>
          <div>
            <label for="checkoutState">State / Province</label>
            <input id="checkoutState" name="state" type="text" required>
          </div>
        </div>

        <label for="checkoutCountry">Country</label>
        <select id="checkoutCountry" name="country" required>
          <option value="">Loading countries...</option>
        </select>

        <label for="checkoutPostalCode">Postal / ZIP Code</label>
        <input id="checkoutPostalCode" name="postalCode" type="text" required>

        <div class="payment">
          <h2>Payment</h2>
          <label><input type="radio" name="paymentMethod" value="cod" checked> Cash on Delivery</label>
          <label><input type="radio" name="paymentMethod" value="online"> Online Payment</label>
        </div>

        <button id="placeOrderButton" type="submit" disabled>Place Order</button>
      </section>

      <aside class="card">
        <h2>Order Summary</h2>
        <div id="checkoutItems"></div>

        <div class="summary-line">
          <span>Currency</span>
          <span id="checkoutCurrency">USD</span>
        </div>

        <div class="summary-line">
          <span>Subtotal</span>
          <span id="checkoutSubtotal">—</span>
        </div>

        <div class="summary-line">
          <span>Shipping</span>
          <span class="free" id="checkoutShipping">FREE</span>
        </div>

        <div class="summary-line total">
          <span>Total</span>
          <span id="checkoutTotal">—</span>
        </div>

        <p style="color:#999;font-size:13px;margin-top:18px">
          Sacchi Flyier-FLY BEYOND LIMITS.
        </p>
      </aside>
    </div>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
