<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Sacchi Flyier</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <div class="logo">
            <a href="index.html">SACCHI FLYIER</a>
        </div>

        <a href="index.html" class="back-to-shop">
            ← Back to Shop
        </a>

    </header>


    <!-- CHECKOUT -->
    <main class="checkout-page">

        <div class="checkout-container">

            <!-- LEFT SIDE -->
            <section class="checkout-form">

                <div class="checkout-heading">
                    <p class="checkout-label">SECURE CHECKOUT</p>
                    <h1>Complete Your Order</h1>
                    <p>
                        Enter your details below to continue with your order.
                    </p>
                </div>


                <!-- CONTACT INFORMATION -->
                <div class="checkout-section">

                    <h2>Contact Information</h2>

                    <label for="checkoutName">Full Name</label>

                    <input
                        type="text"
                        id="checkoutName"
                        name="name"
                        placeholder="Your Full Name"
                        required
                    >


                    <label for="checkoutEmail">Email Address</label>

                    <input
                        type="email"
                        id="checkoutEmail"
                        name="email"
                        placeholder="Your Email Address"
                        required
                    >


                    <label>Phone Number</label>

                    <div class="checkout-phone">

                        <select
                            id="checkoutCountryCode"
                            name="country_code"
                        >
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+1">🇨🇦 +1</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+39">🇮🇹 +39</option>
                            <option value="+81">🇯🇵 +81</option>
                            <option value="+82">🇰🇷 +82</option>
                            <option value="+971">🇦🇪 +971</option>
                        </select>

                        <input
                            type="tel"
                            id="checkoutPhone"
                            name="phone"
                            placeholder="Phone Number"
                            required
                        >

                    </div>

                </div>


                <!-- SHIPPING ADDRESS -->
                <div class="checkout-section">

                    <h2>Shipping Address</h2>


                    <label for="address">
                        Street Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="House number and street name"
                        required
                    >


                    <div class="checkout-row">

                        <div>
                            <label for="city">City</label>

                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="City"
                                required
                            >
                        </div>


                        <div>
                            <label for="state">State</label>

                            <input
                                type="text"
                                id="state"
                                name="state"
                                placeholder="State"
                                required
                            >
                        </div>

                    </div>


                    <div class="checkout-row">

                        <div>
                            <label for="country">
                                Country
                            </label>

                            <input
                                type="text"
                                id="country"
                                name="country"
                                placeholder="Country"
                                required
                            >
                        </div>


                        <div>
                            <label for="postalCode">
                                PIN / ZIP Code
                            </label>

                            <input
                                type="text"
                                id="postalCode"
                                name="postal_code"
                                placeholder="PIN / ZIP"
                                required
                            >
                        </div>

                    </div>

                </div>


                <!-- PAYMENT -->
                <div class="checkout-section">

                    <h2>Payment Method</h2>

                    <div class="payment-option">

                        <input
                            type="radio"
                            id="cod"
                            name="payment"
                            value="cod"
                            checked
                        >

                        <label for="cod">
                            Cash on Delivery
                        </label>

                    </div>


                    <div class="payment-option">

                        <input
                            type="radio"
                            id="online"
                            name="payment"
                            value="online"
                        >

                        <label for="online">
                            Online Payment
                        </label>

                    </div>

                </div>


                <button
                    type="button"
                    id="placeOrderButton"
                    class="place-order-button"
                >
                    Place Order
                </button>

            </section>


            <!-- RIGHT SIDE -->
            <aside class="checkout-summary">

                <p class="checkout-label">
                    YOUR ORDER
                </p>

                <h2>Order Summary</h2>

                <div id="checkoutItems">

                    <!-- Cart items will appear here -->

                </div>


                <div class="summary-line">

                    <span>Subtotal</span>

                    <strong id="checkoutSubtotal">
                        ₹0.00
                    </strong>

                </div>


                <div class="summary-line">

                    <span>Shipping</span>

                    <strong id="checkoutShipping">
                        $19.99
                    </strong>

                </div>


                <div class="summary-total">

                    <span>Total</span>

                    <strong id="checkoutTotal">
                        ₹0.00
                    </strong>

                </div>

            </aside>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <p>
            © 2026 SACCHI FLYIER. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
