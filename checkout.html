
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | Sacchi Flyier</title>
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #252525;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .back-link {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      width: 86%;
      max-width: 1100px;
      margin: 50px auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .panel {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 25px;
    }

    .panel h2 {
      font-size: 19px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      background: #080808;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #aaa;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .order-item {
      display: grid;
      grid-template-columns: 65px 1fr;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid #292929;
    }

    .order-item:first-child {
      padding-top: 0;
    }

    .order-item img {
      width: 65px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      background: #222;
    }

    .order-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 7px;
    }

    .order-details {
      color: #999;
      font-size: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 17px 0;
      color: #aaa;
      font-size: 14px;
    }

    .summary-row.total {
      border-top: 1px solid #333;
      padding-top: 18px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    .place-order-btn {
      width: 100%;
      padding: 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 15px;
    }

    .place-order-btn:hover {
      background: #ccc;
    }

    .notice {
      margin-top: 18px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: #172117;
      border: 1px solid #355335;
      color: #c8edc8;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty-message {
      color: #aaa;
      line-height: 1.6;
    }

    .shop-link {
      display: inline-block;
      margin-top: 15px;
      color: #fff;
    }

    @media (max-width: 750px) {
      header {
        padding: 18px 5%;
      }

      .logo {
        font-size: 17px;
      }

      main {
        width: 90%;
        margin: 35px auto;
      }

      h1 {
        font-size: 28px;
      }

      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 19px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">SACCHI FLYIER</a>
    <a href="cart.html" class="back-link">← Back to Cart</a>
  </header>

  <main>
    <h1>CHECKOUT</h1>
    <p class="subtitle">Enter your details to review your order.</p>

    <div id="checkoutContent"></div>
  </main>

  <script src="cart.js"></script>

  <script>
    const checkoutContent =
      document.getElementById("checkoutContent");

    function formatUSD(amount) {
      return "$" + Number(amount).toFixed(2);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function renderCheckout() {
      const items = SacchiCart.getCheckoutItems();

      if (!items.length) {
        checkoutContent.innerHTML = `
          <div class="panel">
            <p class="empty-message">
              Your cart is empty. Add a product before checkout.
            </p>
            <a class="shop-link" href="index.html">
              Continue shopping
            </a>
          </div>
        `;
        return;
      }

      const subtotal = SacchiCart.getTotalUSD(items);

      checkoutContent.innerHTML = `
        <div class="checkout-layout">

          <section class="panel">
            <h2>CUSTOMER INFORMATION</h2>

            <form id="customerForm">

              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  autocomplete="name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                >
              </div>

              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  required
                >
              </div>

              <div class="form-group">
                <label for="country">Country</label>
                <input
                  id="country"
                  name="country"
                  type="text"
                  autocomplete="country-name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="address">Street Address</label>
                <textarea
                  id="address"
                  name="address"
                  autocomplete="street-address"
                  required
                ></textarea>
              </div>

              <div class="form-group">
                <label for="city">City</label>
                <input
                  id="city"
                  name="city"
                  type="text"
                  autocomplete="address-level2"
                  required
                >
              </div>

              <div class="form-group">
                <label for="postalCode">Postal / ZIP Code</label>
                <input
                  id="postalCode"
                  name="postalCode"
                  type="text"
                  autocomplete="postal-code"
                  required
                >
              </div>

              <button class="place-order-btn" type="submit">
                SUBMIT TEST ORDER
              </button>

            </form>

            <div class="message" id="successMessage">
              Your test form was submitted. No payment was collected
              and no real order was created.
            </div>
          </section>

          <aside class="panel">
            <h2>YOUR ORDER</h2>

            <div>
              ${items.map(item => `
                <div class="order-item">
                  <img
                    src="${escapeHTML(item.image)}"
                    alt="${escapeHTML(item.name)}"
                    onerror="this.style.display='none'"
                  >

                  <div>
                    <div class="order-name">
                      ${escapeHTML(item.name)}
                    </div>

                    <div class="order-details">
                      Quantity: ${Number(item.quantity) || 1}
                    </div>

                    <div class="order-details">
                      ${formatUSD(item.unitPriceUSD)} each
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>

            <div class="summary-row">
              <span>Subtotal</span>
              <span>${formatUSD(subtotal)}</span>
            </div>

            <div class="summary-row">
              <span>Shipping</span>
              <span>Included*</span>
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <span>${formatUSD(subtotal)}</span>
            </div>

            <p class="notice">
              *Shipping is displayed as included for this test checkout.
              Actual shipping charges and payment processing are not
              connected yet.
            </p>
          </aside>

        </div>
      `;

      document
        .getElementById("customerForm")
        .addEventListener("submit", handleTestSubmit);
    }

    function handleTestSubmit(event) {
      event.preventDefault();

      const message =
        document.getElementById("successMessage");

      message.style.display = "block";
      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    renderCheckout();
  </script>

</body>
</html>
